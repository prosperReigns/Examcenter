{% extends "layouts/base.html" %}

{% block title %}
Change Password
{% endblock %}

{% block content %}

<div class="page-header">

<h1>

Change Password

</h1>

</div>

<div class="card">

<form method="POST">

<div class="form-group">

<label>

Current Password

</label>

<input
    type="password"
    name="current_password"
    required
>

</div>

<div class="form-group">

<label>

New Password

</label>

<input
    type="password"
    name="new_password"
    required
>

</div>

<div class="form-group">

<label>

Confirm Password

</label>

<input
    type="password"
    name="confirm_password"
    required
>

</div>

<button class="btn btn-primary">

Update Password

</button>

</form>

</div>

{% endblock %}
