<nav class="breadcrumbs">

    <a href="/dashboard">
        Dashboard
    </a>

    {% for crumb in breadcrumbs %}

        /

        {% if crumb.url %}

            <a href="{{ crumb.url }}">
                {{ crumb.title }}
            </a>

        {% else %}

            <span>
                {{ crumb.title }}
            </span>

        {% endif %}

    {% endfor %}

</nav>
