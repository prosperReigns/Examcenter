{% if total_pages > 1 %}

<nav class="pagination">

    {% if page > 1 %}
    <a href="?page={{ page-1 }}" class="btn btn-light">
        ← Previous
    </a>
    {% endif %}

    {% for p in range(1,total_pages+1) %}

        {% if p == page %}

            <span class="btn btn-primary">
                {{ p }}
            </span>

        {% else %}

            <a href="?page={{ p }}" class="btn btn-light">
                {{ p }}
            </a>

        {% endif %}

    {% endfor %}

    {% if page < total_pages %}
    <a href="?page={{ page+1 }}" class="btn btn-light">
        Next →
    </a>
    {% endif %}

</nav>

{% endif %}
