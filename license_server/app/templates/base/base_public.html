<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ title if title else settings.app_name }}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/public.css') }}"
    >

</head>

<body class="public-shell">

<div class="public-shell__glow public-shell__glow--one"></div>
<div class="public-shell__glow public-shell__glow--two"></div>

<main class="public-shell__content">

    <div class="container py-4 py-md-5">

        {% include "base/alerts.html" %}

        {% block content %}{% endblock %}

    </div>

</main>

<footer class="public-footer">

    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">

        <span>{{ settings.app_name }}</span>

        <span>Secure public purchase and activation flow</span>

    </div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', path='js/app.js') }}"></script>
<script src="{{ url_for('static', path='js/public.js') }}"></script>

</body>
</html>
