{% extends "base/base_admin.html" %}

{% block content %}

<h2>

    {{ title }}

</h2>

<form method="post">

<div class="card shadow-sm">

<div class="card-body">

<div class="row">

<div class="col-md-6 mb-3">

<label>Name</label>

<input
class="form-control"
name="full_name"
value="{{ customer.full_name if customer else '' }}"
required
>

</div>

<div class="col-md-6 mb-3">

<label>Email</label>

<input
type="email"
class="form-control"
name="email"
value="{{ customer.email if customer else '' }}"
required
>

</div>

<div class="col-md-6 mb-3">

<label>Phone</label>

<input
class="form-control"
name="phone"
value="{{ customer.phone if customer else '' }}"
>

</div>

<div class="col-md-12 mb-3">

<label>Address</label>

<textarea
class="form-control"
name="address"
rows="4"
>{{ customer.address if customer else '' }}</textarea>

</div>

</div>

</div>

<div class="card-footer">

<button class="btn btn-success">

Save Customer

</button>

<a
href="/customers"
class="btn btn-secondary"
>

Cancel

</a>

</div>

</div>

</form>

{% endblock %}
