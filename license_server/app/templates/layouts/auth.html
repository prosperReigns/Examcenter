<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            ExamCenter License Server
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/main.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/auth.css') }}"
    >

    {% block styles %}{% endblock %}

</head>

<body class="auth-layout">

<div class="auth-container">

    {% block content %}

    {% endblock %}

</div>

<script src="{{ url_for('static', path='js/auth.js') }}"></script>

{% block scripts %}{% endblock %}

</body>

</html>
