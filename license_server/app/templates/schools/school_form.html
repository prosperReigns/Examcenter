{% extends "base/base_admin.html" %}

{% block content %}

<h2>

{{ title }}

</h2>

<form method="post">

<div class="card shadow-sm">

<div class="card-body">

<div class="row">

<div class="col-md-12 mb-3">

<label>

Customer

</label>

<select
class="form-select"
name="customer_id"
required
>

<option value="">Select customer</option>

{% for customer in customers|default([]) %}

<option
value="{{ customer.id }}"
{% if school and school.customer_id == customer.id %}
selected
{% endif %}
>
{{ customer.name }}
</option>

{% endfor %}

</select>

</div>

<div class="col-md-6 mb-3">

<label>

School Name

</label>

<input
class="form-control"
name="name"
value="{{ school.name if school else '' }}"
required
>

</div>

<div class="col-md-6 mb-3">

<label>

Code

</label>

<input
class="form-control"
name="code"
value="{{ school.code if school else '' }}"
required
>

</div>

<div class="col-md-6 mb-3">

<label>

Email

</label>

<input
type="email"
class="form-control"
name="contact_email"
value="{{ school.contact_email if school else '' }}"
>

</div>

<div class="col-md-6 mb-3">

<label>

Phone

</label>

<input
class="form-control"
name="contact_phone"
value="{{ school.contact_phone if school else '' }}"
>

</div>

<div class="col-md-12 mb-3">

<label>

Address

</label>

<textarea
class="form-control"
rows="4"
name="address"
>{{ school.address if school else '' }}</textarea>

</div>

<div class="col-md-6 mb-3">

<label>

Active

</label>

<div class="form-check mt-2">

<input
class="form-check-input"
type="checkbox"
name="is_active"
value="true"
{% if not school or school.is_active %}
checked
{% endif %}
>

<label class="form-check-label">

School is active

</label>

</div>

</div>

</div>

</div>

<div class="card-footer">

<button class="btn btn-success">

Save School

</button>

<a
href="/schools"
class="btn btn-secondary"
>

Cancel

</a>

</div>

</div>

</form>

{% endblock %}
