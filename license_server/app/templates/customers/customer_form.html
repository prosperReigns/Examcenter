{% extends "base/base_admin.html" %}

{% block content %}

<h2>

    {{ title }}

</h2>

<form method="post">

<div class="card shadow-sm">

<div class="card-body">

<div class="row">

<div class="col-md-6 mb-3">

<label>Name</label>

<input
class="form-control"
name="name"
value="{{ customer.name if customer else '' }}"
required
>

</div>

<div class="col-md-6 mb-3">

<label>Email</label>

<input
type="email"
class="form-control"
name="email"
value="{{ customer.email if customer else '' }}"
required
>

</div>

<div class="col-md-6 mb-3">

<label>Phone</label>

<input
class="form-control"
name="phone"
value="{{ customer.phone if customer else '' }}"
>

</div>

<div class="col-md-12 mb-3">

<label>Country</label>

<textarea
class="form-control"
name="country"
rows="4"
>{{ customer.country if customer else '' }}</textarea>

</div>

<div class="col-md-6 mb-3">

<label>Status</label>

<div class="form-check mt-2">

<input
class="form-check-input"
type="checkbox"
name="is_active"
value="true"
{% if not customer or customer.is_active %}
checked
{% endif %}
>

<label class="form-check-label">

Customer is active

</label>

</div>

</div>

</div>

</div>

<div class="card-footer">

<button class="btn btn-success">

Save Customer

</button>

<a
href="/customers"
class="btn btn-secondary"
>

Cancel

</a>

</div>

</div>

</form>

{% endblock %}
