{% extends "base.html" %}

{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Activate CBT Examination System</h3>
                </div>

                <div class="card-body">
                    <div class="alert alert-info">
                        The software has automatically detected this computer.
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <label class="form-label">Product</label>
                            <input class="form-control" value="{{ product }}" readonly>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Version</label>
                            <input class="form-control" value="{{ version }}" readonly>
                        </div>
                    </div>

                    <div class="mt-3">
                        <label class="form-label">Machine Fingerprint</label>
                        <textarea class="form-control" rows="3" readonly>{{ fingerprint }}</textarea>
                    </div>

                    <div class="mt-3">
                        <label class="form-label">Selected License</label>
                        <input class="form-control" value="{{ plan }}" readonly>
                    </div>

                    <hr>
                    <h5>School Information</h5>

                    <form method="post">
                        <div class="mb-3">
                            <label>School Name</label>
                            <input class="form-control" name="school_name" required>
                        </div>

                        <div class="mb-3">
                            <label>Email</label>
                            <input class="form-control" type="email" name="email" required>
                        </div>

                        <div class="mb-3">
                            <label>Phone Number</label>
                            <input class="form-control" name="phone" required>
                        </div>
                        <button class="btn btn-success btn-lg">Continue</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
