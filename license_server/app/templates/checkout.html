<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <title>Redirecting to Payment</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <style>

        body{

            font-family:Arial,Helvetica,sans-serif;

            background:#f5f5f5;

            display:flex;

            align-items:center;

            justify-content:center;

            height:100vh;

            margin:0;

        }

        .card{

            background:white;

            padding:40px;

            border-radius:12px;

            text-align:center;

            box-shadow:0 10px 25px rgba(0,0,0,.08);

            max-width:500px;

        }

        .spinner{

            width:60px;

            height:60px;

            margin:auto;

            border:6px solid #ddd;

            border-top:6px solid #2563eb;

            border-radius:50%;

            animation:spin 1s linear infinite;

        }

        @keyframes spin{

            from{

                transform:rotate(0deg);

            }

            to{

                transform:rotate(360deg);

            }

        }

        h2{

            margin-top:25px;

        }

        p{

            color:#666;

        }

    </style>

</head>

<body>

<div class="card">

<div class="spinner"></div>

<h2>Redirecting to Secure Payment...</h2>

<p>

Please wait while we connect you securely to our payment provider.

</p>

</div>

<script>

setTimeout(function(){

    window.location="{{ checkout_url }}";

},800);

</script>

</body>

</html>
