{% extends "layouts/auth.html" %}

{% block title %}
Reset Password
{% endblock %}

{% block content %}

<div class="auth-card">

<h2>

Reset Password

</h2>

<form method="POST">

<div class="form-group">

<label>

New Password

</label>

<input
    id="new_password"
    type="password"
    name="password"
    required
>

</div>

<div class="form-group">

<label>

Confirm Password

</label>

<input
    id="confirm_password"
    type="password"
    name="confirm_password"
    required
>

</div>

<button class="btn btn-primary">

Reset Password

</button>

</form>

</div>

{% endblock %}
