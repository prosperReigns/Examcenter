<div
    class="modal fade"
    id="{{ modal_id|default('appModal') }}"
    tabindex="-1"
    aria-labelledby="{{ modal_id|default('appModal') }}Label"
    aria-hidden="true"
>
    <div class="modal-dialog {{ modal_dialog_class|default('') }}">
        <div class="modal-content">
            <div class="modal-header">
                <h5
                    class="modal-title"
                    id="{{ modal_id|default('appModal') }}Label"
                >
                    {{ modal_title|default('Confirm action') }}
                </h5>
                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>
            </div>
            <div class="modal-body">
                {% block modal_body %}
                    {{ modal_body|default('') }}
                {% endblock %}
            </div>
            <div class="modal-footer">
                {% block modal_footer %}
                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancel
                    </button>
                {% endblock %}
            </div>
        </div>
    </div>
</div>
