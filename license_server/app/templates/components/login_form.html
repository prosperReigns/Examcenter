<form
    method="POST"
    action="/login"
>

<div class="form-group">

<label>

Email

</label>

<input
    type="email"
    name="email"
    required
>

</div>

<div class="form-group">

<label>

Password

</label>

<div class="password-wrapper">

<input
    id="password"
    type="password"
    name="password"
    required
>

<button
    type="button"
    class="password-toggle"
    onclick="togglePassword()"
>

👁

</button>

</div>

</div>

<div class="remember-row">

<label>

<input
    type="checkbox"
    name="remember_me"
>

Remember Me

</label>

<a href="/forgot-password">

Forgot Password?

</a>

</div>

<button
    class="btn btn-primary btn-block"
>

Sign In

</button>

</form>
