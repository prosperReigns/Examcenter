{% extends "base/base_admin.html" %}

{% block content %}

<div class="d-flex justify-content-between mb-4">

<h2>

School Details

</h2>

<a
href="/schools"
class="btn btn-secondary"
>

Back

</a>

</div>

<div class="card shadow-sm">

<div class="card-body">

<table class="table">

<tr>

<th>School Name</th>

<td>{{ school.name }}</td>

</tr>

<tr>

<th>Centre Number</th>

<td>{{ school.center_number }}</td>

</tr>

<tr>

<th>Customer</th>

<td>{{ school.customer.full_name }}</td>

</tr>

<tr>

<th>Email</th>

<td>{{ school.email }}</td>

</tr>

<tr>

<th>Phone</th>

<td>{{ school.phone }}</td>

</tr>

<tr>

<th>Address</th>

<td>{{ school.address }}</td>

</tr>

</table>

</div>

</div>

<div class="mt-4">

<a
href="/schools/{{ school.id }}/edit"
class="btn btn-primary"
>

Edit School

</a>

</div>

{% endblock %}
